version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: easy-acp-api
    ports:
      - "3001:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - APP_URL=${APP_URL:-https://acp.wrkth.in}
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped
    # Healthcheck temporarily disabled - package resolution issue
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: easy-acp-web
    ports:
      - "3000:8080"
    environment:
      - API_URL=http://api:8080
    networks:
      - app-network
    depends_on:
      - api
      # Temporarily removed health condition
      # api:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads:
    driver: local

networks:
  app-network:
    driver: bridge
